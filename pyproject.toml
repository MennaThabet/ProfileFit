[project]
name = "profilefit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fady-Laptop", email = "flornn24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "docx>=0.2.4",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.19.0",
    "langgraph>=0.2.0",
    "llama-index>=0.11.0",
    "llama-index-embeddings-google-genai>=0.5.1",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-llms-google-genai>=0.10.0",
    "llama-index-llms-groq>=0.2.0",
    "llama-index-retrievers-bm25>=0.3.0",
    "pydantic>=2.13.4",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.62.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
profilefit = "profilefit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
